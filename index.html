<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5fa">
<title>Lernblatt</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>

<!--
  DESIGN: Jedes Fach ist ein farbiger Ordner, wie im Schulzimmer.
  Startseite = Stapel aus Farbbändern, die den ganzen Bildschirm füllen.
  Ein Band antippen: es wächst über den Bildschirm und wird zum Fach.
  Danach bleibt alles in der Farbe des Fachs, bis man zurückgeht.
-->

<!-- ---------- Fächer ---------- -->
<main id="screen-home" class="screen home">
  <header class="masthead">
    <p class="wordmark">Lernblatt</p>
    <p class="masthead-note">Welches Fach übst du heute?</p>
  </header>
  <nav id="subject-list" class="bands" aria-label="Fächer"></nav>
</main>

<!-- ---------- Units ---------- -->
<main id="screen-unit" class="screen room hidden">
  <div class="room-top">
    <button class="pill back" data-back="home">Alle Fächer</button>
  </div>
  <h1 id="unit-title" class="room-title"></h1>
  <p class="room-lede">Welche Unit kommt im Test?</p>
  <div id="unit-list" class="rows"></div>
  <p id="unit-empty" class="empty hidden"></p>
</main>

<!-- ---------- Runde einstellen ---------- -->
<main id="screen-start" class="screen room hidden">
  <div class="room-top">
    <button id="start-back" class="pill back" data-back="unit"></button>
  </div>
  <h1 id="start-title" class="room-title"></h1>

  <div class="setup">
    <fieldset class="group">
      <legend>Was willst du üben?</legend>
      <div id="set-list" class="chips"></div>
    </fieldset>

    <fieldset class="group">
      <legend>In welche Richtung?</legend>
      <div id="direction-options" class="chips"></div>
    </fieldset>

    <fieldset class="group">
      <legend>Wie willst du antworten?</legend>
      <div id="mode-options" class="chips">
        <label class="chip"><input type="radio" name="mode" value="write" checked><span>Schreiben</span></label>
        <label class="chip"><input type="radio" name="mode" value="choice"><span>Auswählen</span></label>
        <label class="chip"><input type="radio" name="mode" value="reveal"><span>Aufdecken</span></label>
      </div>
    </fieldset>
  </div>

  <p id="start-hint" class="hint" role="alert"></p>
  <button id="btn-start" class="go">Runde starten</button>
</main>

<!-- ---------- Quiz ---------- -->
<main id="screen-quiz" class="screen room quiz hidden">
  <div class="quiz-top">
    <button id="btn-quit" class="pill round" title="Runde beenden" aria-label="Runde beenden">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6 18 18M18 6 6 18"/></svg>
    </button>
    <div class="track" aria-hidden="true"><div id="progress-fill"></div></div>
    <span id="progress-text" class="count"></span>
  </div>

  <div class="ask">
    <p id="prompt-lang" class="ask-side"></p>
    <p id="prompt" class="ask-prompt"></p>
    <p id="streak" class="streak" aria-live="polite"></p>
  </div>

  <div class="respond">
    <form id="write-form" class="mode write">
      <label class="sr" for="answer">Deine Antwort</label>
      <input id="answer" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" placeholder="Deine Antwort">
      <button type="submit" class="go">Prüfen</button>
    </form>

    <div id="choice-box" class="mode choices hidden"></div>

    <div id="reveal-box" class="mode hidden">
      <button id="btn-reveal" class="go">Lösung zeigen</button>
      <div id="reveal-knew" class="pair hidden">
        <button id="btn-knew" class="go">Gewusst</button>
        <button id="btn-unknown" class="go ghost">Nicht gewusst</button>
      </div>
    </div>
  </div>

  <section id="feedback" class="verdict hidden" aria-live="polite">
    <div class="verdict-inner">
      <span class="verdict-mark" aria-hidden="true">
        <svg class="m-good" viewBox="0 0 48 48" focusable="false"><path d="M8 25l11 11L41 12"/></svg>
        <svg class="m-near" viewBox="0 0 48 48" focusable="false"><path d="M8 23l10 10L40 10"/><path d="M24 40h16"/></svg>
        <svg class="m-bad" viewBox="0 0 48 48" focusable="false"><path d="M12 12l24 24M36 12 12 36"/></svg>
      </span>
      <p id="feedback-title" class="verdict-title"></p>
      <p id="feedback-solution" class="verdict-solution"></p>
      <p id="feedback-example" class="verdict-example"></p>
      <button id="btn-next" class="go ink">Weiter</button>
    </div>
  </section>
</main>

<!-- ---------- Ende ---------- -->
<main id="screen-end" class="screen room hidden">
  <h1 class="room-title">Runde fertig</h1>
  <p id="summary" class="tally"></p>
  <div class="end-actions">
    <button id="btn-again-hard" class="go hidden">Schwierige nochmal üben</button>
    <button id="btn-home" class="go ghost">Zurück zur Auswahl</button>
  </div>
</main>

<script src="/franzoesisch-unit-1.js"></script>
<script src="/subjects.js"></script>
<script src="/app.js"></script>
</body>
</html>
